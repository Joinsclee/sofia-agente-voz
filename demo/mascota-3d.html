<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Isa · Clínica Isis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081316; --bg-2:#0b1c20; --ink:#04231f;
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.02);
    --line:rgba(148,204,196,.14); --line-2:rgba(148,204,196,.08);
    --txt:#eef6f4; --muted:#a9c6c1; --muted-2:#7fa39d;
    --teal:#35c2b0; --teal-d:#1c9184; --coral:#ff8f76;
    --ease:cubic-bezier(0.23,1,0.32,1); --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);
    -webkit-font-smoothing:antialiased;letter-spacing:-0.006em;
    background:radial-gradient(900px 520px at 78% -8%,rgba(53,194,176,.14),transparent 60%),radial-gradient(760px 520px at 12% 108%,rgba(255,143,118,.08),transparent 55%),linear-gradient(180deg,var(--bg-2),var(--bg));
    display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
  .shell{width:min(440px,94vw);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 30px 70px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(10px)}
  .topbar{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .mark{width:26px;height:26px;border-radius:8px;flex:0 0 auto;background:linear-gradient(140deg,var(--teal),var(--teal-d));display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:17px;line-height:1;box-shadow:0 4px 12px -3px rgba(53,194,176,.6)}
  .brand .name{font-weight:700;font-size:15px}
  .brand .tag{font-size:12px;color:var(--muted-2);font-weight:500}
  .brand .sep{color:var(--line)}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-2);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--muted-2);transition:.2s}
  body.talking .status .live{background:var(--coral);box-shadow:0 0 0 4px rgba(255,143,118,.18);animation:pulse 1.1s infinite}
  body.connected .status .live{background:var(--teal);box-shadow:0 0 0 4px rgba(53,194,176,.18)}
  body.talking .status{color:var(--txt)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 12%,#f3fbf8 0%,#daf0ea 45%,#b6e2d8 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -46px 90px -40px rgba(31,146,132,.3)}
  .stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
  .overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:20px;color:#0c2a2e;font-size:13.5px;background:rgba(224,244,239,.5);transition:opacity .4s}
  .overlay .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(28,146,132,.25);border-top-color:var(--teal-d);animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay.hide{opacity:0;pointer-events:none}
  .overlay a{color:var(--teal-d);font-weight:600}
  .transcript{min-height:46px;margin:12px 4px 0;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:13px;font-size:14.5px;line-height:1.5;color:#eafffb;text-align:center;display:flex;align-items:center;justify-content:center;transition:border-color .3s,background .3s}
  .transcript:empty::before{content:"Aquí verás lo que dice Bianca…";color:var(--muted-2);font-size:13px}
  body.talking .transcript{border-color:rgba(255,143,118,.35);background:rgba(255,143,118,.05)}
  .controls{display:grid;grid-template-columns:1.4fr 1fr;gap:9px;margin:12px 4px 0}
  .controls .wide{grid-column:1 / -1}
  button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:13px;padding:13px 18px;transition:transform .16s var(--ease),box-shadow .2s,background .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.01em}
  button:active{transform:translateY(1px) scale(.99)}
  button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .primary{background:linear-gradient(180deg,var(--teal),var(--teal-d));color:var(--ink);box-shadow:0 10px 22px -8px rgba(53,194,176,.6),inset 0 1px 0 rgba(255,255,255,.3)}
  .primary:hover{box-shadow:0 14px 28px -8px rgba(53,194,176,.75)}
  .ghost{background:var(--surface);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
  .ghost:hover{background:rgba(255,255,255,.09)}
  button[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:inset 0 0 0 1px var(--line-2)}
  .hint{color:var(--muted-2);font-size:12.5px;line-height:1.55;text-align:center;margin:14px 10px 4px;text-wrap:pretty}
  .hint b{color:var(--muted);font-weight:600}
  .hint a{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand"><span class="mark">+</span><span class="name">Clínica Isis</span><span class="sep">·</span><span class="tag">Mascota virtual</span></div>
      <div class="status"><span class="live"></span><span id="statusText">Lista para atenderte</span></div>
    </div>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="overlay" id="overlay"><div><div class="spin"></div>Preparando la mascota…</div></div>
    </div>
    <div class="transcript" id="caption"></div>
    <div class="controls">
      <button class="primary" id="talkBtn"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg> Hablar con la mascota</button>
      <button class="ghost" id="previewBtn"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4v16l13-8z"/></svg> Vista previa</button>
      <button class="ghost wide" id="stopBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Terminar conversación</button>
    </div>
    <p class="hint" id="hint">Una mascota que te recibe y agenda tu cita. Toca <b>Hablar</b> (requiere micrófono) o <b>Vista previa</b>. ¿Prefieres la versión 2D? <a href="./mascota">ábrela aquí</a>.</p>
  </main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const BACKEND = ((new URLSearchParams(location.search).get("backend")
   || "https://dineroconsciente-digital--agente-voz-ghl-fastapi-app.modal.run")).replace(/\/+$/,"");
const TOKEN_ENDPOINT = BACKEND + "/isis-web-call";

const body=document.body, canvas=document.getElementById('canvas'), stage=document.getElementById('stage');
const overlay=document.getElementById('overlay'), statusText=document.getElementById('statusText'), caption=document.getElementById('caption');
const talkBtn=document.getElementById('talkBtn'), previewBtn=document.getElementById('previewBtn'), stopBtn=document.getElementById('stopBtn'), hint=document.getElementById('hint');

const S = { rms:0, talking:false };
function setStatus(t,connected){ statusText.textContent=t; body.classList.toggle('connected',!!connected); }
function setTalking(on){ S.talking=!!on; body.classList.toggle('talking',!!on); if(!on) S.rms=0; }
function fail(msg){ overlay.classList.remove('hide'); overlay.innerHTML='<div>'+msg+'<br><a href="./mascota">Abrir versión 2D</a></div>'; }

// ================= 3D CREATURE (procedural, invented) =================
let renderer,scene,camera;
let mouth=0, blink=0, nextBlink=1.6, blinking=false, blinkT=0, ready=false;
// references to animated parts
let creature, mouthMesh, upperLid=[], eyeGroup=[], sprout, armL, armR, cheekL, cheekR;

function softMat(color,rough=0.72,metal=0){ return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal}); }

function buildCreature(){
  const g = new THREE.Group();

  // --- body: rounded plush bean ---
  const bodyMat = softMat(0x64d2c1, 0.62);
  const bodyGeo = new THREE.SphereGeometry(1, 96, 72);
  const bodyGroup = new THREE.Group();           // squash/stretch happens here
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.scale.set(1.06, 0.98, 1.0);
  bodyGroup.add(bodyMesh);

  // feet
  const footMat = softMat(0x4fbfad,0.6);
  for(const sx of [-1,1]){
    const f=new THREE.Mesh(new THREE.SphereGeometry(0.24,40,28),footMat);
    f.scale.set(1.1,0.6,1.2); f.position.set(sx*0.42,-0.95,0.32); bodyGroup.add(f);
  }

  // arms (little nubs)
  const armMat = softMat(0x5ccbba,0.62);
  armL=new THREE.Mesh(new THREE.SphereGeometry(0.2,36,26),armMat); armL.scale.set(0.8,1.15,0.8); armL.position.set(-1.02,-0.18,0.28);
  armR=armL.clone(); armR.position.x=1.02; bodyGroup.add(armL,armR);

  // --- eyes: big, glossy, cute ---
  const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35});
  const pupilMat = new THREE.MeshStandardMaterial({color:0x14232a,roughness:0.25});
  for(const sx of [-1,1]){
    const eg=new THREE.Group();
    const white=new THREE.Mesh(new THREE.SphereGeometry(0.235,48,36),eyeWhiteMat); white.scale.set(0.92,1.06,0.7);
    const pupil=new THREE.Mesh(new THREE.SphereGeometry(0.145,40,30),pupilMat); pupil.position.set(sx*0.02,-0.01,0.16); pupil.scale.set(1,1.05,0.7);
    const hi=new THREE.Mesh(new THREE.SphereGeometry(0.05,20,16),new THREE.MeshBasicMaterial({color:0xffffff})); hi.position.set(sx*0.05+0.04,0.07,0.28);
    const hi2=new THREE.Mesh(new THREE.SphereGeometry(0.024,16,12),new THREE.MeshBasicMaterial({color:0xffffff})); hi2.position.set(sx*0.02-0.03,-0.03,0.28);
    eg.add(white,pupil,hi,hi2);
    eg.position.set(sx*0.36,0.04,0.84);
    bodyGroup.add(eg); eyeGroup.push(eg);
  }

  // cheeks (soft blush)
  const cheekMat=new THREE.MeshBasicMaterial({color:0xff8aa2,transparent:true,opacity:0.75});
  cheekL=new THREE.Mesh(new THREE.SphereGeometry(0.15,32,24),cheekMat); cheekL.scale.set(1.25,0.95,0.4); cheekL.position.set(-0.62,-0.14,0.8);
  cheekR=cheekL.clone(); cheekR.position.x=0.6; bodyGroup.add(cheekL,cheekR);

  // mouth: small soft shape that opens (scaleY)
  const mouthMat=new THREE.MeshStandardMaterial({color:0x7a3b40,roughness:0.5});
  mouthMesh=new THREE.Mesh(new THREE.SphereGeometry(0.13,40,28),mouthMat);
  mouthMesh.scale.set(1.15,0.14,0.5); mouthMesh.position.set(0,-0.28,0.96);
  bodyGroup.add(mouthMesh);

  // --- sprout on top (care / welcome) ---
  sprout=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.4,16), softMat(0x3fae97,0.6)); stem.position.y=0.2; sprout.add(stem);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.2,32,24), softMat(0x86e6cf,0.55)); leaf.scale.set(0.7,1.15,0.28); leaf.position.set(0.04,0.46,0); leaf.rotation.z=-0.5; sprout.add(leaf);
  const leaf2=leaf.clone(); leaf2.scale.set(0.5,0.9,0.24); leaf2.position.set(-0.1,0.4,0); leaf2.rotation.z=0.6; sprout.add(leaf2);
  sprout.position.set(0.0,0.98,0.0);
  bodyGroup.add(sprout);

  g.add(bodyGroup);
  g.userData.bodyGroup=bodyGroup;
  creature=g; creature.userData.body=bodyGroup;
  return g;
}

try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'}); }
catch(e){ fail('Tu navegador no soporta 3D (WebGL).'); }
if(renderer){
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
  scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff,0xcdeee7,1.15));
  const key=new THREE.DirectionalLight(0xffffff,1.5); key.position.set(1.2,2.2,2.4); scene.add(key);
  const fill=new THREE.DirectionalLight(0xbfe9ff,0.5); fill.position.set(-2,0.5,1.5); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,0.7); rim.position.set(0,1.5,-2.5); scene.add(rim);
  camera=new THREE.PerspectiveCamera(30,1,0.1,50);
  camera.position.set(0,0.12,5.7); camera.lookAt(0,0.05,0);
  function resize(){ const w=stage.clientWidth,h=stage.clientHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false); }
  addEventListener('resize',resize); resize();

  scene.add(buildCreature());
  ready=true; setTimeout(()=>overlay.classList.add('hide'),120);

  const clock=new THREE.Clock();
  (function tick(){
    requestAnimationFrame(tick);
    const dt=clock.getDelta(), t=clock.elapsedTime;
    if(ready&&creature){
      const bg=creature.userData.body;
      // --- mouth (natural talk): amplitude + soft flap fallback while talking ---
      let target = Math.min(1, S.rms*16);
      if(S.talking){ const flap=0.45+0.4*Math.abs(Math.sin(t*9.5)); target=Math.max(target,flap); }
      else target=0;
      mouth += (target-mouth)*(target>mouth?0.55:0.22);
      mouthMesh.scale.y = 0.14 + mouth*0.62;
      mouthMesh.scale.x = 1.15 - mouth*0.25;      // narrows as it opens -> rounder "o"
      mouthMesh.position.y = -0.28 - mouth*0.05;

      // --- squash & stretch + gentle float (breathing) ---
      const breathe = Math.sin(t*1.9)*0.02;
      const talkPulse = mouth*0.05;
      bg.scale.y = 1 + breathe + talkPulse;
      bg.scale.x = 1 - breathe*0.6 - talkPulse*0.5;
      bg.scale.z = 1 - breathe*0.6 - talkPulse*0.5;
      creature.position.y = -0.02 + Math.sin(t*1.5)*0.05 + mouth*0.03;

      // --- head/body lean & sway (livelier while talking) ---
      const amp = S.talking?1:0.35;
      creature.rotation.z = Math.sin(t*0.8)*0.03*amp;
      creature.rotation.x = (Math.sin(t*1.7)*0.02 + mouth*0.04)*amp;
      creature.rotation.y = Math.sin(t*0.5)*0.05*amp;

      // --- sprout & arms wiggle ---
      if(sprout){ sprout.rotation.z = Math.sin(t*2.2)*0.12*amp; sprout.rotation.x=Math.sin(t*1.6)*0.05; }
      if(armL&&armR){ armL.rotation.z = 0.2+Math.sin(t*2.6)*0.18*amp; armR.rotation.z = -0.2-Math.sin(t*2.6+0.6)*0.18*amp; }

      // --- blink ---
      nextBlink-=dt;
      if(!blinking&&nextBlink<=0){ blinking=true; blinkT=0; }
      if(blinking){ blinkT+=dt; const d=0.14; blink=Math.max(0,Math.min(1, blinkT<d/2?blinkT/(d/2):1-(blinkT-d/2)/(d/2)));
        if(blinkT>=d){ blinking=false; blink=0; nextBlink=2+Math.random()*3.5; } }
      for(const eg of eyeGroup){ eg.scale.y = 1 - blink*0.9; }
    }
    if(renderer) renderer.render(scene,camera);
  })();
}

// ================= Retell web call =================
let retell=null;
async function loadRetell(){ if(window.__RWC) return window.__RWC; const m=await import("https://esm.sh/retell-client-js-sdk@2"); return (window.__RWC=m.RetellWebClient); }
async function talk(){
  stopAll(); setStatus("Conectando…"); talkBtn.disabled=true; caption.textContent="";
  let token;
  try{ const r=await fetch(TOKEN_ENDPOINT,{method:"POST"}); const j=await r.json();
    token=(j.data&&(j.data.access_token||j.data.accessToken))||j.access_token; if(!token) throw 0;
  }catch(e){ setStatus("No se pudo conectar"); hint.textContent="El backend de voz no respondió. Usa Vista previa."; talkBtn.disabled=false; return; }
  let RWC; try{ RWC=await loadRetell(); if(!RWC) throw 0; }catch(e){ setStatus("Sin conexión al SDK"); talkBtn.disabled=false; return; }
  try{
    retell=new RWC();
    retell.on("call_started",()=>{ setStatus("En llamada · háblale",true); stopBtn.disabled=false; try{retell.startAudioPlayback&&retell.startAudioPlayback();}catch(e){} });
    retell.on("call_ended",()=>endCall());
    retell.on("error",()=>{ setStatus("No se pudo iniciar (revisa el micrófono)"); endCall(); });
    retell.on("agent_start_talking",()=>setTalking(true));
    retell.on("agent_stop_talking",()=>setTalking(false));
    retell.on("update",(u)=>{ if(u&&u.transcript){ const last=[...u.transcript].reverse().find(x=>x.role==="agent"); if(last) caption.textContent=last.content; } });
    retell.on("audio",(f32)=>{ if(!f32||!f32.length) return; let s=0; for(let i=0;i<f32.length;i++) s+=f32[i]*f32[i]; S.rms=Math.sqrt(s/f32.length); });
    await retell.startCall({ accessToken: token, emitRawAudioSamples: true });
  }catch(e){ setStatus("No se pudo iniciar la llamada"); talkBtn.disabled=false; }
}
function endCall(){ setTalking(false); setStatus("Lista para atenderte"); talkBtn.disabled=false; stopBtn.disabled=true; if(retell){ try{retell.stopCall&&retell.stopCall();}catch(e){} retell=null; } }

// ================= preview (offline) =================
const INTRO="Hola, soy la asistente de Clínica Isis. Con gusto te ayudo a agendar tu cita de valoración. ¿En qué te puedo ayudar hoy?";
function preview(){
  stopAll(); caption.textContent=""; setTalking(true); setStatus("Presentándose…");
  const words=INTRO.split(" "); let i=0;
  const cap=setInterval(()=>{ caption.textContent=words.slice(0,++i).join(" "); if(i>=words.length) clearInterval(cap); },165);
  const done=()=>{ setTalking(false); setStatus("Lista para atenderte"); stopBtn.disabled=true; };
  try{ const u=new SpeechSynthesisUtterance(INTRO); u.lang="es-419"; u.rate=1.0; u.pitch=1.1;
    const vs=speechSynthesis.getVoices()||[]; const v=vs.find(x=>/es(-|_)?(419|LA|MX|CO|US)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang)); if(v)u.voice=v;
    u.onend=done; u.onerror=done; speechSynthesis.cancel(); speechSynthesis.speak(u); stopBtn.disabled=false;
  }catch(e){ setTimeout(done,words.length*165+400); }
}
function stopAll(){ try{speechSynthesis.cancel();}catch(e){} if(retell){try{retell.stopCall&&retell.stopCall();}catch(e){}retell=null;} setTalking(false); stopBtn.disabled=true; }

talkBtn.addEventListener("click",talk);
previewBtn.addEventListener("click",preview);
stopBtn.addEventListener("click",()=>{ stopAll(); setStatus("Lista para atenderte"); talkBtn.disabled=false; });
</script>
</body>
</html>
