<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bianca 3D · Clínica Isis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081316; --bg-2:#0b1c20; --ink:#04231f;
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.02);
    --line:rgba(148,204,196,.14); --line-2:rgba(148,204,196,.08);
    --txt:#eef6f4; --muted:#a9c6c1; --muted-2:#7fa39d;
    --teal:#35c2b0; --teal-d:#1c9184; --coral:#ff8f76;
    --ease:cubic-bezier(0.23,1,0.32,1); --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);
    -webkit-font-smoothing:antialiased;letter-spacing:-0.006em;
    background:radial-gradient(900px 520px at 78% -8%,rgba(53,194,176,.14),transparent 60%),radial-gradient(760px 520px at 12% 108%,rgba(255,143,118,.08),transparent 55%),linear-gradient(180deg,var(--bg-2),var(--bg));
    display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
  .shell{width:min(440px,94vw);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 30px 70px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(10px)}
  .topbar{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .mark{width:26px;height:26px;border-radius:8px;flex:0 0 auto;background:linear-gradient(140deg,var(--teal),var(--teal-d));display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:17px;line-height:1;box-shadow:0 4px 12px -3px rgba(53,194,176,.6)}
  .brand .name{font-weight:700;font-size:15px}
  .brand .tag{font-size:12px;color:var(--muted-2);font-weight:500}
  .brand .sep{color:var(--line)}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-2);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--muted-2);transition:.2s}
  body.talking .status .live{background:var(--coral);box-shadow:0 0 0 4px rgba(255,143,118,.18);animation:pulse 1.1s infinite}
  body.connected .status .live{background:var(--teal);box-shadow:0 0 0 4px rgba(53,194,176,.18)}
  body.talking .status{color:var(--txt)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    background:radial-gradient(120% 92% at 50% -6%,#eaf7f3 0%,#cfe9e2 46%,#a9d6ce 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 -46px 90px -40px rgba(31,146,132,.35)}
  .stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
  .overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:20px;
    color:#0c2a2e;font-size:13.5px;background:rgba(224,244,239,.55);backdrop-filter:blur(2px);transition:opacity .4s}
  .overlay .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(28,146,132,.25);border-top-color:var(--teal-d);animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay.hide{opacity:0;pointer-events:none}
  .overlay a{color:var(--teal-d);font-weight:600}
  .transcript{min-height:46px;margin:12px 4px 0;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:13px;font-size:14.5px;line-height:1.5;color:#eafffb;text-align:center;display:flex;align-items:center;justify-content:center;transition:border-color .3s,background .3s}
  .transcript:empty::before{content:"Aquí verás lo que dice Bianca…";color:var(--muted-2);font-size:13px}
  body.talking .transcript{border-color:rgba(255,143,118,.35);background:rgba(255,143,118,.05)}
  .controls{display:grid;grid-template-columns:1.4fr 1fr;gap:9px;margin:12px 4px 0}
  .controls .wide{grid-column:1 / -1}
  button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:13px;padding:13px 18px;transition:transform .16s var(--ease),box-shadow .2s,background .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.01em}
  button:active{transform:translateY(1px) scale(.99)}
  button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .primary{background:linear-gradient(180deg,var(--teal),var(--teal-d));color:var(--ink);box-shadow:0 10px 22px -8px rgba(53,194,176,.6),inset 0 1px 0 rgba(255,255,255,.3)}
  .primary:hover{box-shadow:0 14px 28px -8px rgba(53,194,176,.75)}
  .ghost{background:var(--surface);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
  .ghost:hover{background:rgba(255,255,255,.09)}
  button[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:inset 0 0 0 1px var(--line-2)}
  .hint{color:var(--muted-2);font-size:12.5px;line-height:1.55;text-align:center;margin:14px 10px 4px;text-wrap:pretty}
  .hint b{color:var(--muted);font-weight:600}
  .hint a{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand"><span class="mark">+</span><span class="name">Clínica Isis</span><span class="sep">·</span><span class="tag">Mascota virtual 3D</span></div>
      <div class="status"><span class="live"></span><span id="statusText">Lista para atenderte</span></div>
    </div>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="overlay" id="overlay"><div><div class="spin"></div>Cargando mascota 3D…</div></div>
    </div>
    <div class="transcript" id="caption"></div>
    <div class="controls">
      <button class="primary" id="talkBtn"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg> Hablar con Bianca</button>
      <button class="ghost" id="previewBtn"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4v16l13-8z"/></svg> Vista previa</button>
      <button class="ghost wide" id="stopBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Terminar conversación</button>
    </div>
    <p class="hint" id="hint">Mascota 3D con voz neutra en vivo. Toca <b>Hablar con Bianca</b> (requiere micrófono) o <b>Vista previa</b>. ¿Prefieres la versión 2D? <a href="./mascota">ábrela aquí</a>.</p>
  </main>

<script type="importmap">
{ "imports": {
  "three":         "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.2/lib/three-vrm.module.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const BACKEND = ((new URLSearchParams(location.search).get("backend")
   || "https://dineroconsciente-digital--agente-voz-ghl-fastapi-app.modal.run")).replace(/\/+$/,"");
const TOKEN_ENDPOINT = BACKEND + "/isis-web-call";
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@v3.5.2/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';

const body=document.body, canvas=document.getElementById('canvas'), stage=document.getElementById('stage');
const overlay=document.getElementById('overlay'), statusText=document.getElementById('statusText'), caption=document.getElementById('caption');
const talkBtn=document.getElementById('talkBtn'), previewBtn=document.getElementById('previewBtn'), stopBtn=document.getElementById('stopBtn'), hint=document.getElementById('hint');

const state = { rms:0, talking:false };
function setStatus(t,connected){ statusText.textContent=t; body.classList.toggle('connected',!!connected); }
function setTalking(on){ state.talking=!!on; body.classList.toggle('talking',!!on); if(!on) state.rms=0; }
function fail(msg){ overlay.classList.remove('hide'); overlay.innerHTML='<div>'+msg+'<br><a href="./mascota">Abrir versión 2D</a></div>'; }

// ---------- three.js + VRM ----------
let renderer,scene,camera,vrm=null,head=null,mouth=0,ready=false;
let blink=0,nextBlink=1.5,blinking=false,blinkT=0;
try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
}catch(e){ fail('Tu navegador no soporta 3D (WebGL).'); }
if(renderer){
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.NoToneMapping;            // ACES lava el toon shading (MToon)
  scene=new THREE.Scene();
  scene.add(new THREE.DirectionalLight(0xffffff,1.5).translateY(2));
  const key=new THREE.DirectionalLight(0xffffff,1.4); key.position.set(0.5,2.0,1.5); scene.add(key);
  scene.add(new THREE.AmbientLight(0xffffff,0.95));    // ambiente fuerte = look plano de caricatura
  camera=new THREE.PerspectiveCamera(24,1,0.1,20);
  function resize(){ const w=stage.clientWidth,h=stage.clientHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false); }
  addEventListener('resize',resize); resize();

  const loader=new GLTFLoader();
  loader.register(parser=>new VRMLoaderPlugin(parser));
  loader.load(MODEL_URL,(gltf)=>{
    vrm=gltf.userData.vrm;
    try{ VRMUtils.rotateVRM0(vrm); }catch(e){}
    vrm.scene.traverse(o=>o.frustumCulled=false);
    scene.add(vrm.scene);
    head=vrm.humanoid.getNormalizedBoneNode('head');
    // frame head-and-shoulders around the actual head height
    const hp=new THREE.Vector3(); (head||vrm.scene).getWorldPosition(hp);
    const y=head?hp.y:1.4;
    camera.position.set(0,y+0.02,0.98); camera.lookAt(0,y-0.02,0);
    ready=true; overlay.classList.add('hide');
  },undefined,(err)=>{ console.error('VRM load failed',err); fail('No se pudo cargar la mascota 3D.'); });

  const clock=new THREE.Clock();
  (function tick(){
    requestAnimationFrame(tick);
    const dt=clock.getDelta(), t=clock.elapsedTime;
    if(vrm){
      const em=vrm.expressionManager;
      // LIP SYNC: RMS -> 'aa' con gain alto (caricatura = exagerado)
      let target = Math.min(1, state.rms*15);
      if(state.talking){                          // FLAP de respaldo: siempre se mueve al hablar
        const flap = 0.4 + 0.4*Math.abs(Math.sin(t*11));
        target = Math.max(target, flap*0.9);
      } else target = 0;
      mouth += (target-mouth)*(target>mouth?0.6:0.25);
      em.setValue('aa', mouth);
      em.setValue('ih', state.talking ? mouth*0.15*(0.5+0.5*Math.sin(t*7)) : 0);
      em.setValue('happy', state.talking ? 0.18 : 0.10);   // expresión amable
      // BLINK
      nextBlink-=dt;
      if(!blinking && nextBlink<=0){ blinking=true; blinkT=0; }
      if(blinking){ blinkT+=dt; const d=0.13; blink=Math.max(0,Math.min(1, blinkT<d/2?blinkT/(d/2):1-(blinkT-d/2)/(d/2)));
        if(blinkT>=d){ blinking=false; blink=0; nextBlink=2+Math.random()*4; } }
      em.setValue('blink', blink);
      // HEAD: sway idle + cabeceos al hablar
      if(head){ const amp=state.talking?1.0:0.28;
        head.rotation.x=(Math.sin(t*2.1)*0.05 + mouth*0.09)*amp;
        head.rotation.y=Math.sin(t*0.7)*0.06*amp;
        head.rotation.z=Math.sin(t*1.3)*0.02*amp; }
      vrm.update(dt);
    }
    if(renderer&&scene&&camera) renderer.render(scene,camera);
  })();
}

// ---------- Retell web call ----------
let retell=null;
async function loadRetell(){ if(window.__RWC) return window.__RWC; const m=await import("https://esm.sh/retell-client-js-sdk@2"); return (window.__RWC=m.RetellWebClient); }
async function talk(){
  stopAll(); setStatus("Conectando…"); talkBtn.disabled=true; caption.textContent="";
  let token;
  try{ const r=await fetch(TOKEN_ENDPOINT,{method:"POST"}); const j=await r.json();
    token=(j.data&&(j.data.access_token||j.data.accessToken))||j.access_token; if(!token) throw 0;
  }catch(e){ setStatus("No se pudo conectar"); hint.textContent="El backend de voz no respondió. Usa Vista previa."; talkBtn.disabled=false; return; }
  let RWC; try{ RWC=await loadRetell(); if(!RWC) throw 0; }catch(e){ setStatus("Sin conexión al SDK"); talkBtn.disabled=false; return; }
  try{
    retell=new RWC();
    retell.on("call_started",()=>{ setStatus("En llamada · háblale",true); stopBtn.disabled=false; try{retell.startAudioPlayback&&retell.startAudioPlayback();}catch(e){} });
    retell.on("call_ended",()=>endCall());
    retell.on("error",()=>{ setStatus("No se pudo iniciar (revisa el micrófono)"); endCall(); });
    retell.on("agent_start_talking",()=>setTalking(true));
    retell.on("agent_stop_talking",()=>setTalking(false));
    retell.on("update",(u)=>{ if(u&&u.transcript){ const last=[...u.transcript].reverse().find(x=>x.role==="agent"); if(last) caption.textContent=last.content; } });
    retell.on("audio",(f32)=>{ if(!f32||!f32.length) return; let s=0; for(let i=0;i<f32.length;i++) s+=f32[i]*f32[i]; state.rms=Math.sqrt(s/f32.length); });
    await retell.startCall({ accessToken: token, emitRawAudioSamples: true });
  }catch(e){ setStatus("No se pudo iniciar la llamada"); talkBtn.disabled=false; }
}
function endCall(){ setTalking(false); setStatus("Lista para atenderte"); talkBtn.disabled=false; stopBtn.disabled=true; if(retell){ try{retell.stopCall&&retell.stopCall();}catch(e){} retell=null; } }

// ---------- preview (offline) ----------
const INTRO="Hola, soy Bianca, la asistente de Clínica Isis. Con gusto te ayudo a agendar tu cita de valoración. ¿En qué te puedo ayudar hoy?";
function preview(){
  stopAll(); caption.textContent=""; setTalking(true); setStatus("Presentándose…");
  const words=INTRO.split(" "); let i=0;
  const cap=setInterval(()=>{ caption.textContent=words.slice(0,++i).join(" "); if(i>=words.length) clearInterval(cap); },165);
  const done=()=>{ setTalking(false); setStatus("Lista para atenderte"); stopBtn.disabled=true; };
  try{ const u=new SpeechSynthesisUtterance(INTRO); u.lang="es-419"; u.rate=1.0; u.pitch=1.05;
    const vs=speechSynthesis.getVoices()||[]; const v=vs.find(x=>/es(-|_)?(419|LA|MX|CO|US)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang)); if(v)u.voice=v;
    u.onend=done; u.onerror=done; speechSynthesis.cancel(); speechSynthesis.speak(u); stopBtn.disabled=false;
  }catch(e){ setTimeout(done,words.length*165+400); }
}
function stopAll(){ try{speechSynthesis.cancel();}catch(e){} if(retell){try{retell.stopCall&&retell.stopCall();}catch(e){}retell=null;} setTalking(false); stopBtn.disabled=true; }

talkBtn.addEventListener("click",talk);
previewBtn.addEventListener("click",preview);
stopBtn.addEventListener("click",()=>{ stopAll(); setStatus("Lista para atenderte"); talkBtn.disabled=false; });
</script>
</body>
</html>
