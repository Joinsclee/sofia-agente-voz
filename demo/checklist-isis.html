<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Programación Quirúrgica · Clínica Isis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081316; --bg-2:#0b1c20; --panel:#0c1e23; --panel2:#12292f;
    --line:rgba(148,204,196,.12); --line-2:rgba(148,204,196,.07);
    --teal:#35c2b0; --teal-d:#1c9184; --txt:#eff6f4; --muted:#a9c6c1; --muted-2:#7fa39d;
    --red:#ff7a6b; --amber:#f4c452; --green:#3ad39b;
    --chipbg:rgba(255,255,255,.05); --ease:cubic-bezier(.23,1,.32,1); --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.006em;
    color:var(--txt);height:100dvh;overflow:hidden;
    background:radial-gradient(900px 520px at 82% -8%,rgba(53,194,176,.10),transparent 60%),radial-gradient(700px 480px at 6% 108%,rgba(255,143,118,.05),transparent 55%),linear-gradient(180deg,var(--bg-2),var(--bg))}
  .app{display:grid;grid-template-columns:212px 1fr;height:100dvh}
  /* ---- rail ---- */
  .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-0.01em;padding:4px 8px 14px}
  .brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--teal),var(--teal-d));display:grid;place-items:center;color:#04231f;font-weight:800;font-size:17px;line-height:1;box-shadow:0 4px 12px -3px rgba(53,194,176,.55)}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);padding:12px 10px 5px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
  .nav a:hover{background:var(--panel2);color:var(--txt)}
  .nav a.on{background:var(--panel2);color:var(--txt);box-shadow:inset 2px 0 0 var(--teal)}
  .nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .nav a .badge{margin-left:auto;background:var(--chipbg);border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 7px;color:var(--muted)}
  .userchip{display:flex;align-items:center;gap:9px;padding:9px 8px;border-top:1px solid var(--line);margin-top:6px}
  .userchip .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#2a4f57,#173038);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--teal)}
  .userchip small{color:var(--muted-2);font-size:11px;display:block}
  .userchip .nm{font-size:12.5px;font-weight:600}
  /* ---- main ---- */
  .main{min-width:0;display:flex;flex-direction:column;height:100dvh}
  .topbar{display:flex;align-items:center;gap:14px;padding:15px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:-0.015em;margin:0}
  .topbar .sub{color:var(--muted-2);font-size:13px}
  .spacer{flex:1}
  .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-2)}
  select{font:inherit;background:var(--chipbg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .ghostbtn{background:var(--chipbg);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
  .ghostbtn:hover{color:var(--txt)}
  .scroll{overflow:auto;padding:20px 24px 40px;min-height:0}
  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:0 20px 50px -34px rgba(0,0,0,.7)}
  .kpi .k{font-size:12px;color:var(--muted-2);display:flex;align-items:center;gap:7px}
  .kpi .k svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin-top:6px}
  .kpi .v small{font-size:14px;color:var(--muted-2);font-weight:500}
  .kpi.accent .v{color:var(--teal)}
  /* ---- generic panels ---- */
  .cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
  @media(max-width:900px){.cols{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)}}
  h2{font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted-2);margin:0 0 10px;font-weight:600}
  .daybar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .daybar button{background:var(--chipbg);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit}
  .daybar button.active{background:linear-gradient(180deg,var(--teal),var(--teal-d));color:#04231f;border-color:transparent;font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 24px 60px -34px rgba(0,0,0,.75)}
  .row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--panel2)}
  .row.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--teal)}
  .sem{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
  .sem.red{background:var(--red);box-shadow:0 0 0 3px rgba(255,255,255,.04),0 0 7px rgba(255,122,107,.5)} .sem.amber{background:var(--amber);box-shadow:0 0 0 3px rgba(255,255,255,.04),0 0 7px rgba(244,196,82,.45)} .sem.green{background:var(--green);box-shadow:0 0 0 3px rgba(255,255,255,.04),0 0 7px rgba(58,211,155,.5)}
  .row .meta{flex:1;min-width:0}
  .row .name{font-weight:600}
  .row .sub{font-size:12.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .count{font-size:12px;color:var(--muted);background:var(--chipbg);border-radius:999px;padding:3px 9px}
  .detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-height:200px;box-shadow:0 24px 60px -34px rgba(0,0,0,.75)}
  .detail .head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .detail .head b{font-size:20px;font-weight:700;letter-spacing:-0.01em}
  .detail .proc{color:var(--muted-2);font-size:13px;margin-bottom:14px}
  .item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
  .item:last-of-type{border-bottom:0}
  .cbx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;display:grid;place-items:center;transition:.15s;background:var(--chipbg)}
  .cbx.on{background:var(--green);border-color:var(--green)}
  .cbx svg{opacity:0;transition:.15s} .cbx.on svg{opacity:1}
  .item .lbl{flex:1}
  .item .lbl .t{font-weight:600}
  .item .lbl .t .req{color:var(--red);font-weight:800;margin-left:3px}
  .item .lbl .by{font-size:12px;color:var(--muted-2);margin-top:2px}
  .banner{border-radius:12px;padding:11px 13px;margin:14px 0;font-weight:600;font-size:14px;display:flex;gap:9px;align-items:center}
  .banner.red{background:rgba(255,122,107,.13);color:#ffb3aa;border:1px solid rgba(255,122,107,.3)}
  .banner.amber{background:rgba(244,196,82,.12);color:#f5cf88;border:1px solid rgba(244,196,82,.3)}
  .banner.green{background:rgba(58,211,155,.12);color:#8ff0cc;border:1px solid rgba(58,211,155,.3)}
  .handoff{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;font:inherit}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(180deg,var(--teal),var(--teal-d));color:#04231f;font-weight:700}
  .btn.primary[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:var(--chipbg);color:var(--txt);border:1px solid var(--line)}
  .noteform{display:flex;gap:8px;margin-top:10px}
  .noteform textarea{flex:1;background:var(--chipbg);border:1px solid var(--line);border-radius:11px;color:var(--txt);font:inherit;padding:10px 12px;resize:vertical;min-height:44px}
  .noteform textarea:focus{outline:none;border-color:var(--teal)}
  .log h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-2);margin:16px 0 8px}
  .log .entry{font-size:12.5px;color:var(--muted);padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px}
  .log .entry .whoi{color:var(--teal);font-weight:600;white-space:nowrap}
  .empty{color:var(--muted-2);text-align:center;padding:40px 10px}
  /* tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-2);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px}
  tr:last-child td{border-bottom:0}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .tag.green{background:rgba(58,211,155,.13);color:#8ff0cc} .tag.amber{background:rgba(244,196,82,.12);color:#f5cf88} .tag.red{background:rgba(255,122,107,.13);color:#ffb3aa}
  /* traceability bars */
  .bars{display:flex;flex-direction:column;gap:14px;margin-top:4px}
  .bars .barrow{display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:12px;font-size:13px}
  .bars .track{height:10px;border-radius:999px;background:var(--chipbg);overflow:hidden}
  .bars .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal-d),var(--teal))}
  .note-foot{color:var(--muted-2);font-size:12.5px;line-height:1.55;margin-top:18px;max-width:70ch}
  .pill{display:inline-block;background:var(--chipbg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted-2)}
  @media(max-width:720px){ .app{grid-template-columns:1fr} .rail{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="dot">+</span> Clínica&nbsp;Isis</div>
    <nav class="nav" id="nav"></nav>
    <div class="userchip"><span class="av" id="uav">RM</span><div><div class="nm" id="unm">Recepción</div><small id="urole">turno mañana</small></div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="viewTitle">Programación quirúrgica</h1><div class="sub" id="viewSub">Cirugías del día y su preparación</div></div>
      <div class="spacer"></div>
      <div class="who">Estás como
        <select id="who">
          <option>Recepción · turno mañana</option>
          <option>Recepción · turno tarde</option>
          <option>Enfermería</option>
          <option>Líder de sede</option>
        </select>
      </div>
      <button class="ghostbtn" id="reset">↺ Reiniciar</button>
    </div>
    <div class="scroll" id="scroll"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const CHECK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#04231f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  const IC = {
    prog:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14l2 2 4-4"/></svg>',
    pac:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M17 8h4M19 6v4"/></svg>',
    ind:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    act:'<svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
    clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
    alert:'<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    shield:'<svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  };
  const NAV = [
    {id:"prog", t:"Programación", ic:IC.prog, title:"Programación quirúrgica", sub:"Cirugías del día y su preparación"},
    {id:"pac",  t:"Pacientes",    ic:IC.pac, title:"Pacientes del día", sub:"Estado de preparación por paciente"},
    {id:"ind",  t:"Indicadores",  ic:IC.ind, title:"Indicadores", sub:"Trazabilidad y cumplimiento · ISO 9001"},
    {id:"act",  t:"Actividad",    ic:IC.act, title:"Actividad", sub:"Historial inmutable de todo el equipo"},
  ];
  const ITEMS = [
    {k:"examenes", t:"Exámenes prequirúrgicos recibidos", req:true},
    {k:"preanest", t:"Valoración preanestésica", req:true},
    {k:"consent",  t:"Consentimiento informado firmado", req:true},
    {k:"protesis", t:"Prótesis / insumos confirmados", req:true, onlyIf:"needsProtesis"},
    {k:"ayuno",    t:"Ayuno informado al paciente", req:false},
    {k:"acomp",    t:"Acompañante confirmado", req:false},
  ];
  const SEED = [
    {id:"p1", code:"Paciente A. M.", proc:"Mamoplastia de aumento", hora:"07:30", cir:"Dr. Ramírez", needsProtesis:true},
    {id:"p2", code:"Paciente L. G.", proc:"Rinoplastia", hora:"09:00", cir:"Dra. Salazar", needsProtesis:false},
    {id:"p3", code:"Paciente C. R.", proc:"Lipoescultura", hora:"11:00", cir:"Dr. Ramírez", needsProtesis:false},
    {id:"p4", code:"Paciente J. P.", proc:"Blefaroplastia", hora:"14:00", cir:"Dra. Salazar", needsProtesis:false},
  ];
  const DAYS = ["Hoy","Mañana","Miércoles"];
  const KEY = "isis_checklist_demo_v2";

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  let state = load() || {};
  let view="prog", day=0, selId=null, noteOpen=false;

  const S=document.getElementById("scroll");
  const who=()=>document.getElementById("who").value;
  const pkey=(id,d)=>((d==null?day:d)+":"+id);
  function rec(id,d){ const k=pkey(id,d); return state[k]||(state[k]={items:{},log:[],handoff:null}); }
  const items=p=>ITEMS.filter(it=>!it.onlyIf||p[it.onlyIf]);
  function now(){ const d=new Date(); return d.toLocaleString("es-CO",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"}); }
  function status(p,d){ const r=rec(p.id,d); const list=items(p); const reqs=list.filter(i=>i.req);
    const doneReq=reqs.filter(i=>r.items[i.k]).length, doneAny=list.filter(i=>r.items[i.k]).length;
    if(doneReq===reqs.length) return {s:"green",txt:"Lista",done:doneAny,total:list.length};
    if(doneAny===0) return {s:"red",txt:"Sin preparar",done:0,total:list.length};
    return {s:"amber",txt:"En preparación",done:doneAny,total:list.length};
  }
  function dayStats(d){ let g=0,a=0,r=0; SEED.forEach(p=>{const s=status(p,d).s; if(s==="green")g++;else if(s==="amber")a++;else r++;}); return {g,a,r,total:SEED.length}; }

  // ---------- shell ----------
  function renderShell(){
    document.getElementById("nav").innerHTML =
      `<div class="lbl">Operación</div>` +
      NAV.map(n=>{ const b = n.id==="prog"?`<span class="badge">${dayStats(day).total}</span>`
                         : n.id==="act"?`<span class="badge">${allLog().length}</span>`:"";
        return `<a data-v="${n.id}" class="${view===n.id?'on':''}">${n.ic}<span>${n.t}</span>${b}</a>`; }).join("");
    document.getElementById("nav").querySelectorAll("a").forEach(a=>a.onclick=()=>{view=a.getAttribute("data-v");selId=null;noteOpen=false;render();});
    const n=NAV.find(x=>x.id===view);
    document.getElementById("viewTitle").textContent=n.title;
    document.getElementById("viewSub").textContent=n.sub;
    const parts=who().split("·"); const nm=parts[0].trim();
    document.getElementById("uav").textContent=nm.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
    document.getElementById("unm").textContent=nm;
    document.getElementById("urole").textContent=(parts[1]||"").trim()||"equipo";
  }
  function kpis(){
    const st=dayStats(day); const reqTotal=SEED.reduce((a,p)=>a+items(p).filter(i=>i.req).length,0);
    const reqDone=SEED.reduce((a,p)=>{const r=rec(p.id);return a+items(p).filter(i=>i.req&&r.items[i.k]).length;},0);
    const pct=reqTotal?Math.round(reqDone/reqTotal*100):0;
    return `<div class="kpis">
      <div class="kpi"><div class="k">${IC.clock} Cirugías del día</div><div class="v">${st.total}</div></div>
      <div class="kpi accent"><div class="k">${IC.check} Listas para cirugía</div><div class="v">${st.g}<small> / ${st.total}</small></div></div>
      <div class="kpi"><div class="k">${IC.alert} Con pendientes</div><div class="v">${st.a+st.r}</div></div>
      <div class="kpi"><div class="k">${IC.shield} Trazabilidad</div><div class="v">${pct}<small>%</small></div></div>
    </div>`;
  }

  // ---------- view: programación ----------
  function viewProg(){
    S.innerHTML = kpis() + `<div class="daybar" id="daybar"></div>
      <div class="cols"><div><h2>Cirugías del día</h2><div class="card" id="list"></div></div>
      <div><h2>Checklist del paciente</h2><div class="detail" id="detail"></div></div></div>`;
    const bar=document.getElementById("daybar");
    DAYS.forEach((d,i)=>{const b=document.createElement("button");b.textContent=d;if(i===day)b.className="active";
      b.onclick=()=>{day=i;selId=null;render();};bar.appendChild(b);});
    const el=document.getElementById("list");
    SEED.forEach(p=>{const st=status(p);const row=document.createElement("div");row.className="row"+(p.id===selId?" sel":"");
      row.onclick=()=>{selId=p.id;render();};
      row.innerHTML=`<span class="sem ${st.s}"></span><div class="meta"><div class="name">${p.code}</div><div class="sub">${p.hora} · ${p.proc} · ${p.cir}</div></div><span class="count">${st.done}/${st.total}</span>`;
      el.appendChild(row);});
    renderDetail();
  }
  function renderDetail(){
    const el=document.getElementById("detail"); if(!el) return;
    const p=SEED.find(x=>x.id===selId);
    if(!p){ el.innerHTML='<div class="empty">Selecciona una cirugía para ver y completar su checklist.</div>'; return; }
    const r=rec(p.id); const list=items(p); const st=status(p);
    let h=`<div class="head"><span class="sem ${st.s}"></span><b>${p.code}</b></div><div class="proc">${p.hora} · ${p.proc} · ${p.cir}</div>`;
    list.forEach(it=>{const on=!!r.items[it.k];
      const by=on&&r.items[it.k].by?`<div class="by">✓ ${esc(r.items[it.k].by)} · ${r.items[it.k].at}</div>`:"";
      h+=`<div class="item"><div class="cbx ${on?'on':''}" data-k="${it.k}">${CHECK}</div><div class="lbl"><div class="t">${it.t}${it.req?'<span class="req">*</span>':''}</div>${by}</div></div>`;});
    const b= st.s==="green"?{c:"green",t:"✓ Lista para cirugía · todos los requisitos completos"}:st.s==="red"?{c:"red",t:"● Faltan requisitos críticos · no entregar como lista"}:{c:"amber",t:"● En preparación · faltan requisitos por confirmar"};
    h+=`<div class="banner ${b.c}">${b.t}</div><div class="handoff"><button class="btn primary" id="handoffBtn" ${st.s!=="green"?"disabled":""}>Entregar turno como lista</button><button class="btn ghost" id="noteBtn">${noteOpen?'Cancelar':'Registrar nota de turno'}</button></div>`;
    if(noteOpen) h+=`<div class="noteform"><textarea id="noteInput" rows="2" placeholder="Nota de turno para ${esc(p.code)}…"></textarea><button class="btn primary" id="noteSave">Guardar</button></div>`;
    if(r.handoff) h+=`<div class="banner ${st.s==='green'?'green':'amber'}">Turno entregado por <b>${esc(r.handoff.by)}</b> · ${r.handoff.at}${st.s!=='green'?' (cambió después de la entrega)':''}</div>`;
    h+=`<div class="log"><h3>Historial (inmutable)</h3>`;
    if(!r.log.length) h+=`<div class="entry">Sin movimientos aún.</div>`;
    else [...r.log].reverse().forEach(e=>{h+=`<div class="entry"><span>${e.at}</span><span class="whoi">${esc(e.by)}</span><span>${esc(e.what)}</span></div>`;});
    h+=`</div>`;
    el.innerHTML=h;
    el.querySelectorAll(".cbx").forEach(c=>c.onclick=()=>toggle(p,c.getAttribute("data-k")));
    const hb=el.querySelector("#handoffBtn"); if(hb) hb.onclick=()=>handoff(p);
    el.querySelector("#noteBtn").onclick=()=>{noteOpen=!noteOpen;renderDetail();const t=document.getElementById("noteInput");if(t)t.focus();};
    const ns=el.querySelector("#noteSave"); if(ns) ns.onclick=()=>saveNote(p);
  }
  function toggle(p,k){const r=rec(p.id);const it=ITEMS.find(i=>i.k===k);
    if(r.items[k]){delete r.items[k];r.log.push({at:now(),by:who(),what:`desmarcó "${it.t}"`});}
    else{r.items[k]={by:who(),at:now()};r.log.push({at:now(),by:who(),what:`marcó "${it.t}"`});}
    save(state);render();}
  function handoff(p){const r=rec(p.id);r.handoff={by:who(),at:now()};r.log.push({at:now(),by:who(),what:"ENTREGÓ el turno con la cirugía marcada como LISTA"});save(state);render();}
  function saveNote(p){const t=document.getElementById("noteInput");const txt=t?t.value.trim():"";if(!txt){noteOpen=false;renderDetail();return;}
    rec(p.id).log.push({at:now(),by:who(),what:"nota: "+txt});noteOpen=false;save(state);render();}

  // ---------- view: pacientes ----------
  function viewPac(){
    let rows=SEED.map(p=>{const st=status(p);const req=items(p).filter(i=>i.req);const rd=req.filter(i=>rec(p.id).items[i.k]).length;
      return `<tr><td><b>${p.code}</b></td><td>${p.proc}</td><td>${p.hora}</td><td>${p.cir}</td><td>${rd}/${req.length}</td><td><span class="tag ${st.s}"><span class="sem ${st.s}" style="width:8px;height:8px;box-shadow:none"></span>${st.txt}</span></td></tr>`;}).join("");
    S.innerHTML = kpis() + `<div class="card"><table><thead><tr><th>Paciente</th><th>Procedimiento</th><th>Hora</th><th>Cirujano</th><th>Requisitos</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note-foot">Cada paciente lleva su checklist con requisitos críticos y firma de turno. El estado de arriba se calcula solo: nadie lo marca "listo" a mano si falta un requisito.</p>`;
  }

  // ---------- view: indicadores ----------
  function viewInd(){
    const bars=DAYS.map((d,i)=>{const s=dayStats(i);const pct=Math.round(s.g/s.total*100);
      return `<div class="barrow"><span>${d}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;}).join("");
    S.innerHTML = kpis() + `<div class="cols">
      <div class="card" style="padding:18px"><h2>Trazabilidad por día (listas / total)</h2><div class="bars">${bars}</div></div>
      <div class="card" style="padding:18px"><h2>Por qué importa</h2>
        <p class="note-foot" style="margin-top:2px">Una cirugía cancelada por un requisito faltante (prótesis, exámenes o consentimiento) cuesta entre <b>$10.000.000 y $28.000.000</b> y, en una IPS certificada <b>ISO 9001</b>, es una <b>no conformidad</b>. Este tablero convierte el traspaso entre turnos en evidencia auditable: quién confirmó qué, cuándo, y con qué firma.</p>
        <div class="kpis" style="grid-template-columns:1fr 1fr;margin-top:14px;margin-bottom:0">
          <div class="kpi accent"><div class="k">${IC.shield} Requisitos con firma</div><div class="v">${allLog().filter(e=>/marcó/.test(e.what)).length}</div></div>
          <div class="kpi"><div class="k">${IC.act} Movimientos hoy</div><div class="v">${allLog().length}</div></div>
        </div>
      </div></div>`;
  }

  // ---------- view: actividad (global immutable log) ----------
  function allLog(){
    const out=[];
    Object.keys(state).forEach(k=>{const [d,id]=k.split(":");const p=SEED.find(x=>x.id===id);if(!p)return;
      (state[k].log||[]).forEach((e,idx)=>out.push({...e,pac:p.code,day:DAYS[+d]||d,ord:(+d)*1000+idx}));});
    return out;
  }
  function viewAct(){
    const rows=allLog().slice().reverse().map(e=>`<tr><td style="white-space:nowrap;color:var(--muted-2)">${e.at}</td><td><span class="whoi" style="color:var(--teal);font-weight:600">${esc(e.by)}</span></td><td>${esc(e.pac)} <span class="pill">${e.day}</span></td><td>${esc(e.what)}</td></tr>`).join("");
    S.innerHTML = kpis() + `<div class="card"><table><thead><tr><th>Cuándo</th><th>Quién</th><th>Paciente</th><th>Acción</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">Sin actividad todavía. Marca requisitos en Programación para ver el registro.</td></tr>'}</tbody></table></div>
      <p class="note-foot">Registro <b>inmutable</b>: cada acción queda con autor y hora. Es la evidencia de trazabilidad que pide una auditoría ISO 9001, y lo que evita el "yo pensé que la del turno anterior ya lo había hecho".</p>`;
  }

  function render(){ renderShell();
    if(view==="prog") viewProg(); else if(view==="pac") viewPac(); else if(view==="ind") viewInd(); else viewAct(); }

  document.getElementById("who").onchange=render;
  document.getElementById("reset").onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); };
  render();
})();
</script>
</body>
</html>
