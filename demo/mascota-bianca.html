<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bianca · Clínica Isis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081316; --bg-2:#0b1c20; --ink:#04231f;
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.02);
    --line:rgba(148,204,196,.14); --line-2:rgba(148,204,196,.08);
    --txt:#eef6f4; --muted:#a9c6c1; --muted-2:#7fa39d;
    --teal:#35c2b0; --teal-d:#1c9184; --coral:#ff8f76;
    --skin:#f4c6a6; --hair:#3a2b28;
    --ease:cubic-bezier(0.23,1,0.32,1);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--txt); -webkit-font-smoothing:antialiased; letter-spacing:-0.006em;
    background:
      radial-gradient(900px 520px at 78% -8%, rgba(53,194,176,.14), transparent 60%),
      radial-gradient(760px 520px at 12% 108%, rgba(255,143,118,.08), transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px;
  }
  .shell{
    width:min(440px,94vw);
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:0 30px 70px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(10px);
  }
  .topbar{display:flex; align-items:center; gap:10px; padding:6px 8px 12px}
  .brand{display:flex; align-items:center; gap:9px; min-width:0}
  .brand .mark{
    width:26px;height:26px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--teal),var(--teal-d));
    display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:14px;
    box-shadow:0 4px 12px -3px rgba(53,194,176,.6);
  }
  .brand .name{font-weight:700;font-size:15px;letter-spacing:-0.01em}
  .brand .tag{font-size:12px;color:var(--muted-2);font-weight:500}
  .brand .sep{color:var(--line);}
  .status{
    margin-left:auto; display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--line-2);
    padding:6px 11px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted); white-space:nowrap;
  }
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--muted-2);transition:.2s}
  body.talking .status .live{background:var(--coral); box-shadow:0 0 0 4px rgba(255,143,118,.18); animation:pulse 1.1s infinite}
  body.connected .status .live{background:var(--teal); box-shadow:0 0 0 4px rgba(53,194,176,.18)}
  body.talking .status{color:var(--txt)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .stage{
    position:relative; width:100%; aspect-ratio:1/1;
    border-radius:16px; overflow:hidden;
    background:
      radial-gradient(120% 88% at 50% -6%, #f2fbf8 0%, #d6efe9 44%, #a9dcd4 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), inset 0 -40px 80px -30px rgba(31,146,132,.35);
  }
  .stage::before{ /* soft top light */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.55), transparent 70%);
  }
  .stage::after{ /* grounding vignette */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 122%, rgba(28,146,132,.28), transparent 52%);
  }
  svg.mascota{position:absolute;inset:0;width:100%;height:100%}

  /* --- idle motion --- */
  #body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.8s var(--ease) infinite}
  @keyframes breathe{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(.4deg)}}
  #headGroup{transform-box:fill-box;transform-origin:50% 90%;animation:sway 6.8s var(--ease) infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .lid{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0)}
  body.blink .lid{animation:blink 5.4s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
  #armR{transform-box:fill-box;transform-origin:78% 12%;animation:wave 7.5s var(--ease) infinite}
  @keyframes wave{0%,100%{transform:rotate(0)}8%{transform:rotate(-8deg)}16%{transform:rotate(2deg)}24%{transform:rotate(-5deg)}32%{transform:rotate(0)}}
  body.talking #brows{animation:browlift 1.9s var(--ease) infinite}
  @keyframes browlift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  body.talking #headGroup{animation:sway 3.4s var(--ease) infinite}

  .transcript{
    min-height:46px; margin:12px 4px 0; padding:12px 15px;
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:13px;
    font-size:14.5px; line-height:1.5; color:#eafffb; text-align:center;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .3s, background .3s;
  }
  .transcript:empty::before{content:"Aquí verás lo que dice Bianca…";color:var(--muted-2);font-size:13px}
  body.talking .transcript{border-color:rgba(255,143,118,.35); background:rgba(255,143,118,.05)}

  .controls{display:grid; grid-template-columns:1.4fr 1fr; gap:9px; margin:12px 4px 0}
  .controls .wide{grid-column:1 / -1}
  button{
    font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:13px;
    padding:13px 18px; transition:transform .16s var(--ease), box-shadow .2s var(--ease), background .2s, opacity .2s;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; letter-spacing:-0.01em;
  }
  button:active{transform:translateY(1px) scale(.99)}
  .primary{background:linear-gradient(180deg,var(--teal),var(--teal-d)); color:var(--ink); box-shadow:0 10px 22px -8px rgba(53,194,176,.6), inset 0 1px 0 rgba(255,255,255,.3)}
  .primary:hover{box-shadow:0 14px 28px -8px rgba(53,194,176,.75)}
  .ghost{background:var(--surface); color:var(--txt); box-shadow:inset 0 0 0 1px var(--line)}
  .ghost:hover{background:rgba(255,255,255,.09)}
  button[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:inset 0 0 0 1px var(--line-2)}
  .hint{color:var(--muted-2); font-size:12.5px; line-height:1.55; text-align:center; margin:14px 10px 4px; text-wrap:pretty}
  .hint b{color:var(--muted); font-weight:600}
  @media (prefers-reduced-motion: reduce){#body,#headGroup,#armR,.lid,#brows{animation:none !important}}
</style>
</head>
<body class="blink">
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <span class="mark">✦</span>
        <span class="name">Clínica Isis</span><span class="sep">·</span><span class="tag">Asistente virtual</span>
      </div>
      <div class="status"><span class="live"></span><span id="statusText">Lista para atenderte</span></div>
    </div>

    <div class="stage" id="stage">
      <!-- ===== MASCOTA (SVG rig: cabeza, ojos con parpadeo, cejas, boca lip-sync, brazo) ===== -->
      <svg class="mascota" viewBox="0 0 400 400" aria-label="Bianca, mascota de Clínica Isis">
        <defs>
          <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4ebeb"/>
          </linearGradient>
          <radialGradient id="faceG" cx="50%" cy="42%" r="62%">
            <stop offset="0" stop-color="#f9cead"/><stop offset="72%" stop-color="#f2c1a0"/><stop offset="100%" stop-color="#e6b191"/>
          </radialGradient>
          <radialGradient id="cheekG" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ff9b8a" stop-opacity=".5"/><stop offset="1" stop-color="#ff9b8a" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="hairG" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0" stop-color="#4f3a33"/><stop offset="1" stop-color="#2b1f1b"/>
          </linearGradient>
          <linearGradient id="hairHi" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6a4d43" stop-opacity=".85"/><stop offset="1" stop-color="#6a4d43" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="iris" cx="50%" cy="40%" r="60%">
            <stop offset="0" stop-color="#5b463f"/><stop offset="100%" stop-color="#2c1f1b"/>
          </radialGradient>
        </defs>

        <!-- soft floor shadow -->
        <ellipse cx="200" cy="392" rx="120" ry="16" fill="rgba(28,120,108,.22)"/>

        <!-- BODY -->
        <g id="body">
          <path d="M104 400 C104 316 148 296 200 296 C252 296 296 316 296 400 Z" fill="url(#topG)"/>
          <path d="M200 300 L200 400" stroke="#dbe4e4" stroke-width="2.5"/>
          <circle cx="200" cy="330" r="4" fill="#cdd7d7"/><circle cx="200" cy="352" r="4" fill="#cdd7d7"/>
          <path d="M173 300 L200 330 L227 300 Z" fill="#eef3f3"/>
          <path d="M182 302 C190 340 190 360 196 396" stroke="var(--teal)" stroke-width="7" fill="none" stroke-linecap="round"/>
          <rect x="188" y="352" width="20" height="26" rx="5" fill="var(--teal)"/>
          <rect x="192" y="357" width="12" height="3" rx="1.5" fill="rgba(255,255,255,.6)"/>
          <g id="armR">
            <path d="M270 316 C300 320 316 298 320 274" stroke="url(#topG)" stroke-width="26" fill="none" stroke-linecap="round"/>
            <circle cx="322" cy="268" r="15" fill="#f0bd99"/>
          </g>
          <path d="M130 316 C104 324 96 350 100 370" stroke="url(#topG)" stroke-width="26" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="372" r="14" fill="#f0bd99"/>
        </g>

        <!-- HEAD -->
        <g id="headGroup">
          <!-- hair back -->
          <path d="M116 152 C116 68 174 42 200 42 C226 42 284 68 284 152 C302 212 288 252 280 264 L120 264 C112 252 98 212 116 152 Z" fill="url(#hairG)"/>
          <!-- neck + soft shadow -->
          <rect x="185" y="226" width="30" height="46" rx="14" fill="#e3ad88"/>
          <ellipse cx="200" cy="250" rx="34" ry="12" fill="rgba(150,90,60,.18)"/>
          <!-- face -->
          <ellipse id="face" cx="200" cy="176" rx="75" ry="85" fill="url(#faceG)"/>
          <!-- ears + earrings -->
          <circle cx="127" cy="182" r="12.5" fill="#efb896"/><circle cx="273" cy="182" r="12.5" fill="#efb896"/>
          <circle cx="127" cy="197" r="4" fill="var(--teal)"/><circle cx="273" cy="197" r="4" fill="var(--teal)"/>
          <!-- cheeks -->
          <circle cx="151" cy="199" r="19" fill="url(#cheekG)"/><circle cx="249" cy="199" r="19" fill="url(#cheekG)"/>
          <!-- brows -->
          <g id="brows" fill="none" stroke="#43312b" stroke-width="5.5" stroke-linecap="round">
            <path d="M151 139 Q168 130 185 137"/>
            <path d="M215 137 Q232 130 249 139"/>
          </g>
          <!-- eyes -->
          <g id="eyes">
            <ellipse cx="168" cy="167" rx="15" ry="18" fill="#fbfdfd"/>
            <ellipse cx="232" cy="167" rx="15" ry="18" fill="#fbfdfd"/>
            <circle cx="170" cy="169" r="8.6" fill="url(#iris)"/><circle cx="234" cy="169" r="8.6" fill="url(#iris)"/>
            <circle cx="173" cy="165" r="2.7" fill="#fff"/><circle cx="237" cy="165" r="2.7" fill="#fff"/>
            <!-- lashes -->
            <path d="M153 158 Q168 150 184 157" fill="none" stroke="#2f2320" stroke-width="3" stroke-linecap="round"/>
            <path d="M216 157 Q232 150 247 158" fill="none" stroke="#2f2320" stroke-width="3" stroke-linecap="round"/>
            <!-- eyelids (blink) -->
            <rect class="lid" x="151" y="148" width="34" height="40" rx="15" fill="#f2c1a0"/>
            <rect class="lid" x="215" y="148" width="34" height="40" rx="15" fill="#f2c1a0"/>
          </g>
          <!-- nose -->
          <path d="M200 177 q6 13 -2 21" fill="none" stroke="#dda07f" stroke-width="3.5" stroke-linecap="round"/>
          <!-- MOUTH (lip-sync: se escala en Y con el audio) -->
          <g id="mouthG" transform="translate(200 214)">
            <path id="mouth" d="M-22 0 Q0 6 22 0 Q0 4 -22 0 Z" fill="#a13a3f"/>
            <path id="teeth" d="M-16 -1 Q0 1 16 -1 L16 -3 Q0 -2 -16 -3 Z" fill="#fff"/>
            <path id="tongue" d="M-10 3 Q0 12 10 3 Q0 8 -10 3Z" fill="#e07d88" opacity="0"/>
          </g>
          <!-- front hair + highlight -->
          <path d="M122 150 C136 94 180 72 200 72 C220 72 264 94 278 150 C250 118 232 116 214 126 C208 102 192 102 186 126 C168 116 150 118 122 150 Z" fill="url(#hairG)"/>
          <path d="M150 96 C170 80 196 78 206 80 C188 86 168 100 156 120 C150 110 148 102 150 96 Z" fill="url(#hairHi)"/>
        </g>
      </svg>
    </div>

    <div class="transcript" id="caption"></div>

    <div class="controls">
      <button class="primary" id="talkBtn">🎤 Hablar con Bianca</button>
      <button class="ghost" id="previewBtn">▶ Vista previa</button>
      <button class="ghost wide" id="stopBtn" disabled>■ Terminar conversación</button>
    </div>
    <p class="hint" id="hint">Toca <b>Hablar con Bianca</b> para conversar en vivo con su voz neutra, o <b>Vista previa</b> para verla presentarse. Requiere micrófono para la conversación en vivo.</p>
  </main>

<script>
(function(){
  "use strict";
  // ---- Config: el backend mintea el token de llamada web de Retell ----
  const BACKEND = ((new URLSearchParams(location.search).get("backend")
     || "https://dineroconsciente-digital--agente-voz-ghl-fastapi-app.modal.run")).replace(/\/+$/,"");
  const TOKEN_ENDPOINT = BACKEND + "/isis-web-call";

  const body = document.body;
  const mouth = document.getElementById("mouth");
  const mouthG = document.getElementById("mouthG");
  const teeth = document.getElementById("teeth");
  const tongue = document.getElementById("tongue");
  const statusText = document.getElementById("statusText");
  const caption = document.getElementById("caption");
  const talkBtn = document.getElementById("talkBtn");
  const previewBtn = document.getElementById("previewBtn");
  const stopBtn = document.getElementById("stopBtn");
  const hint = document.getElementById("hint");

  // ---- Lip-sync engine: openness 0..1 -> forma de la boca ----
  let target=0, cur=0, raf=null;
  function animateMouth(){
    cur += (target-cur)*0.35;
    const o = Math.max(0, Math.min(1, cur));
    // boca: de línea (cerrada) a óvalo (abierta)
    const h = 2 + o*20;      // alto
    const w = 22 - o*4;      // se angosta al abrir
    mouth.setAttribute("d", `M${-w} 0 Q0 ${h} ${w} 0 Q0 ${-h*0.35} ${-w} 0 Z`);
    mouthG.setAttribute("transform", `translate(200 ${214 + o*3})`);
    teeth.style.opacity = o>0.18 ? 1 : 0;
    tongue.style.opacity = o>0.55 ? 0.9 : 0;
    raf = requestAnimationFrame(animateMouth);
  }
  animateMouth();

  function setTalking(on){ body.classList.toggle("talking", on); if(!on) target=0; }
  function setStatus(t, connected){ statusText.textContent=t; body.classList.toggle("connected", !!connected); }

  // ---------- MODO 1: Vista previa (offline, SpeechSynthesis + flap por tiempo) ----------
  const INTRO = "Hola, soy Bianca, la asistente de Clínica Isis. Con gusto te ayudo a agendar tu cita de valoración. ¿En qué te puedo ayudar hoy?";
  let previewTimer=null;
  function pickSpanishVoice(){
    const vs = speechSynthesis.getVoices()||[];
    return vs.find(v=>/es(-|_)?(419|LA|MX|CO|US)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
  }
  function preview(){
    stopAll();
    caption.textContent = "";
    setTalking(true); setStatus("Presentándose…");
    // flap de boca mientras "habla"
    previewTimer = setInterval(()=>{ target = 0.25 + Math.random()*0.7; }, 95);
    // subtítulo palabra por palabra
    const words = INTRO.split(" "); let i=0;
    const capTimer = setInterval(()=>{ caption.textContent = words.slice(0,++i).join(" "); if(i>=words.length) clearInterval(capTimer); }, 165);
    const done = ()=>{ clearInterval(previewTimer); target=0; setTalking(false); setStatus("Lista para atenderte"); stopBtn.disabled=true; };
    try{
      const u = new SpeechSynthesisUtterance(INTRO);
      u.lang="es-419"; u.rate=1.0; u.pitch=1.05;
      const v=pickSpanishVoice(); if(v) u.voice=v;
      u.onend=done; u.onerror=done;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      stopBtn.disabled=false;
    }catch(e){ setTimeout(done, words.length*165+400); }
  }
  // voices can load late
  if(typeof speechSynthesis!=="undefined") speechSynthesis.onvoiceschanged=()=>{};

  // ---------- MODO 2: Hablar con Bianca (Retell web call, voz real + lip-sync por amplitud) ----------
  let retell=null, gotAudio=false;
  async function loadRetell(){
    if(window.__RWC) return window.__RWC;
    // El build CJS/UMD no funciona con <script> plano; se importa como ESM
    // (esm.sh resuelve livekit-client + eventemitter3). import() dinámico funciona
    // dentro de este IIFE sin convertir la página a type="module".
    const mod = await import("https://esm.sh/retell-client-js-sdk@2");
    return (window.__RWC = mod.RetellWebClient);
  }
  async function talk(){
    stopAll();
    setStatus("Conectando…"); talkBtn.disabled=true; caption.textContent="";
    let token;
    try{
      const r = await fetch(TOKEN_ENDPOINT, {method:"POST"});
      const j = await r.json();
      token = (j.data && (j.data.access_token||j.data.accessToken)) || j.access_token || j.accessToken;
      if(!token) throw new Error("sin token");
    }catch(e){ setStatus("No se pudo conectar"); hint.textContent="El backend de llamada web no respondió. Usa Vista previa mientras tanto."; talkBtn.disabled=false; return; }
    let RWC;
    try{ RWC = await loadRetell(); if(!RWC) throw new Error(); }
    catch(e){ setStatus("Sin conexión al SDK"); hint.textContent="No se pudo cargar el SDK de voz (revisa internet). Usa Vista previa."; talkBtn.disabled=false; return; }
    try{
      retell = new RWC();
      gotAudio=false;
      retell.on("call_started", ()=>{ setStatus("En llamada — háblale", true); stopBtn.disabled=false; try{ retell.startAudioPlayback && retell.startAudioPlayback(); }catch(e){} });
      retell.on("call_ended", ()=>{ endCall(); });
      // startCall atrapa sus propios errores (mic denegado, fallo de conexión) y
      // emite "error" en vez de lanzar — sin este listener el botón "no hace nada".
      retell.on("error", ()=>{ setStatus("No se pudo iniciar (revisa el micrófono)"); endCall(); });
      retell.on("agent_start_talking", ()=>{ setTalking(true); if(!gotAudio) flapFallback(); });
      retell.on("agent_stop_talking", ()=>{ setTalking(false); target=0; });
      retell.on("update", (u)=>{ if(u && u.transcript){ const last=[...u.transcript].reverse().find(t=>t.role==="agent"); if(last) caption.textContent=last.content; } });
      // lip-sync por amplitud real — requiere emitRawAudioSamples:true
      retell.on("audio", (pcm)=>{ if(!pcm||!pcm.length) return; gotAudio=true; let s=0; for(let i=0;i<pcm.length;i++) s+=pcm[i]*pcm[i]; const rms=Math.sqrt(s/pcm.length); target = Math.min(1, rms*7); });
      await retell.startCall({ accessToken: token, emitRawAudioSamples: true });
    }catch(e){ setStatus("No se pudo iniciar la llamada"); talkBtn.disabled=false; }
  }
  // fallback: si no llegan frames de audio, animar boca mientras el agente habla
  function flapFallback(){
    // Solo mientras el agente habla y AÚN no llegan frames de audio reales.
    const tick=()=>{ if(!body.classList.contains("talking") || gotAudio){ return; } target = 0.3 + Math.random()*0.65; setTimeout(tick, 90); };
    tick();
  }
  function endCall(){ setTalking(false); target=0; gotAudio=false; setStatus("Lista para atenderte"); talkBtn.disabled=false; stopBtn.disabled=true; if(retell){ try{retell.stopCall&&retell.stopCall();}catch(e){} retell=null;} }

  function stopAll(){
    if(previewTimer){clearInterval(previewTimer); previewTimer=null;}
    if(typeof speechSynthesis!=="undefined") speechSynthesis.cancel();
    if(retell){ try{retell.stopCall&&retell.stopCall();}catch(e){} retell=null; }
    gotAudio=false; setTalking(false); target=0; stopBtn.disabled=true;
  }

  talkBtn.addEventListener("click", talk);
  previewBtn.addEventListener("click", preview);
  stopBtn.addEventListener("click", ()=>{ stopAll(); setStatus("Lista para atenderte"); talkBtn.disabled=false; });
})();
</script>
</body>
</html>
