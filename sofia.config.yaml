# =============================================================
# sofia.config.yaml — business data for `agente-voz-ghl`
#
# THIS FILE IS VERSIONED. It describes the business; it grants
# access to nothing. Secrets live in .env (gitignored).
#
# Hard rule: if a value identifies the business -> here.
#            if a value grants access to a service -> .env.
#
# Source of truth for these decisions: planeacion.md
# Values marked PENDIENTE_* are open questions, not defaults.
# =============================================================

business:
  name: "Clínica Estética Aurora"
  industry: estetica
  website: "clinicaesteticaaurora.site"
  address: "Carrera 43A #7-50, El Poblado, Medellín"
  google_maps: "https://maps.google.com/?q=Carrera%2043A%20%237-50%2C%20El%20Poblado%2C%20Medell%C3%ADn"
  timezone: "America/Bogota"        # UTC-5 year-round, NO DST — see note below
  country: CO                       # RESUELTO 2026-08-06 tras el primer ensayo real.
                                    # Solo se usa para inferir la lada cuando el paciente
                                    # dicta el número sin código de país (ghl_service.to_e164).
                                    # Estaba en MX y un celular colombiano dictado a 10
                                    # dígitos se guardó como +523182354883: lada equivocada,
                                    # y devolver la llamada marcaría a México.
                                    # La Location, el timezone y los pacientes son colombianos.
  locale: "es-419"        # es-MX NO es un idioma válido en Retell (verificado en cámara, V06)
  # RESUELTO (2026-08-05): el horario declarado vuelve a coincidir con la agenda real.
  # Medido sobre 21 días del calendario "Consultoría Implementación de Funnels y CRM"
  # (5cZiNfL2nv2dYORwMxlK), el patrón es estable semana a semana:
  #   lunes a viernes, sin fines de semana
  #   martes y jueves            -> primer hueco 10:00
  #   lunes, miércoles y viernes -> primer hueco 11:00
  #   todos los días             -> último hueco 17:00
  # Se declara la ventana completa (10:00-17:00), no el mínimo común (11:00), porque
  # Sofía nunca inventa horarios: solo ofrece los que el backend le da del calendario.
  # Decir 08:00 la hacía prometer una hora para la que jamás hubo hueco, que es
  # exactamente el bug que este bloque documentaba como resuelto para el config viejo.
  #
  # `hours` es el único de los tres que se usa de verdad: viaja literal al prompt de
  # Retell (retell_service.py:170) y el prompt lo aplica como regla dura ("Solo ofrece
  # horarios dentro del horario de atención"). `hours_start` y `hours_end` no los lee
  # ni el backend ni los prompts; solo los edita scripts/customize.py.
  hours: "Lunes a viernes de 10:00 a 17:00"
  hours_start: "10:00"
  hours_end: "17:00"

  # -----------------------------------------------------------------
  # Números que DESVÍAN hacia el agente. En E.164.
  #
  # Colombia no tiene portabilidad de fijos (la CRC solo implementó la móvil),
  # así que una clínica conserva su número publicado desviándolo al nuestro, no
  # moviéndolo. En ese salto algunos operadores conservan el número de quien
  # llama y otros lo reemplazan por la línea que desvía.
  #
  # Si lo reemplazan, ese número entra como si fuera el del paciente. Y como la
  # línea telefónica le gana a los dígitos dictados (la corrección del número
  # fantasma), TODOS los pacientes se escribirían con él. upsert_contact es
  # idempotente por teléfono, así que no se duplicarían: colapsarían en un solo
  # contacto con todas las citas encima, y la clínica no podría devolver ni una
  # llamada.
  #
  # Declarar aquí cada número que desvía hace que el sistema lo trate como lo
  # que es: una línea que no identifica a nadie. Se cae entonces al número que
  # el paciente dictó, que el prompt sí pide y confirma con rigor.
  #
  # Se declara, no se adivina: qué número desvía es un hecho de la instalación.
  forwarding_source_numbers: []

# -------------------------------------------------------------
# TIMEZONE WARNING — read before writing book_appointment
# -------------------------------------------------------------
# America/Bogota is UTC-05:00 all year. It does NOT observe DST and it is
# NOT the same as Mexico City (-06:00), which the briefs use as an example.
#
# 2026-08-04: la Location destino cambió a "JoinsClee (Funnels & CRM)", cuyo
# timezone declarado es America/Bogota. Mismo offset que el America/Cancun
# anterior (-05:00 todo el año), así que las citas ya agendadas no se corren.
#
# Always DERIVE the offset from `business.timezone`. Never hardcode it.
# A hardcoded offset books every appointment one hour off.
# -------------------------------------------------------------

agent:
  name: "Sofía"
  role: "Recepcionista de la clínica"
  tone: "amable, empático, tranquilizador"
  # Mucha gente que llama a un dentista llama con miedo o con dolor.
  # Ese es el estado emocional que Sofía tiene que sostener.

  voice:
    provider: platform     # voz de plataforma de Retell (retell-Andrea), NO ElevenLabs
    language: "es-419"     # Retell solo acepta es-ES y es-419; México cae en es-419
    style: "cálido"
    voice_id: "retell-Andrea"        # voz de plataforma de Retell, acento mexicano, femenina
                                     # OJO: el agente se llama Sofía; Andrea es el nombre de la VOZ
    speak_during_execution: true     # habla mientras consulta disponibilidad

  llm:
    model: claude-haiku              # verificar nombre exacto en el selector de Retell
    temperature: 0.35                # 0.3-0.4 — precisión sobre creatividad

  # Las tres cosas que Sofía hace. Nada más.
  jobs:
    - "Contestar 24/7"
    - "Calificar a quien llama"
    - "Agendar una cita de valoración"

  # Lo que NO hace — tan importante como lo que sí.
  guardrails:
    never_diagnoses: true
    diagnosis_deflection: "El doctor te valora en la cita"
    prices_are_always_approximate: true
    # Sofía nunca escribe en el expediente clínico (contact.notas_clinicas).
    # Misma línea del "nunca diagnostica", aplicada a los datos.
    never_writes_clinical_record: true

  end_call:
    # Gotcha: Retell outbound no cuelga solo. Sin esto la llamada
    # se queda abierta consumiendo minutos.
    enable_end_call_tool: true
    end_call_after_silence_ms: 10000

# -------------------------------------------------------------
# Preguntas de calificación — EL ORDEN IMPORTA
# Pedir el teléfono antes de escuchar el problema hace que cuelguen.
# -------------------------------------------------------------
qualification:
  questions:
    - order: 1
      key: motivo
      ask: "Motivo de la llamada"
      maps_to_field: "contact.reason_for_visit"

    - order: 2
      key: sintoma_urgencia
      ask: "Síntoma y urgencia"
      triggers_urgency: true

    - order: 3
      key: tratamiento_interes
      ask: "Tratamiento de interés"

    - order: 4
      key: datos_contacto
      ask: "Nombre, teléfono y correo"
      # Al final, ya con confianza construida.

  urgency:
    # DOLOR, HINCHAZÓN o SANGRADO -> urgencia, priorizar.
    triggers: ["dolor", "hinchazón", "sangrado"]
    action: "Ofrecer el hueco disponible más cercano y marcar como urgencia"
    # "Priorizar" = agendar antes. NO = interpretar el síntoma.
    # La regla de nunca diagnosticar sigue vigente en urgencia.

pacing:
  phone_digit_by_digit: true         # confirmando al final
  spell_out_emails: true
  pause_after_availability_check_s: 3
  say_slots_once: true               # formato hablado: "el martes a las cuatro de la tarde"
  accuracy_over_speed: true          # cuando dude, frena

# -------------------------------------------------------------
# KNOWLEDGE BASE — tratamientos
#
# Por qué viven AQUÍ y no en una base de datos: en dental no hay
# inventario que buscar. La lista es fija y corta. Eso nos ahorra un
# endpoint, una fuente de datos y toda una clase de bugs
# (inventario desactualizado, "te ofrecí algo que ya no está").
#
# TODOS los precios son APROXIMADOS, siempre. El precio final sale
# de la valoración.
# -------------------------------------------------------------
knowledge_base:
  currency: COP
  prices_are_approximate: true
  financing: ["Welli", "Servicredito"]

  # Precios COP de referencia ("desde"/"anda alrededor de"). El valor final
  # SIEMPRE sale de la valoración: cada cuerpo es distinto.
  treatments:
    # -- Cirugía plástica --
    - key: rinoplastia
      name: "Rinoplastia"
      price_approx: 8000000

    - key: mamoplastia
      name: "Mamoplastia de aumento"
      price_approx: 10000000

    - key: mastopexia
      name: "Mastopexia (levantamiento de senos)"
      price_approx: 9000000

    - key: lipoescultura
      name: "Lipoescultura / lipoabdominoplastia"
      price_approx: 9000000

    - key: blefaroplastia
      name: "Blefaroplastia (párpados)"
      price_approx: 4000000

    - key: bichectomia
      name: "Bichectomía"
      price_approx: 3500000

    # -- Medicina estética --
    - key: botox
      name: "Toxina botulínica (bótox)"
      price_approx: 600000

    - key: acido_hialuronico
      name: "Ácido hialurónico (rellenos)"
      price_approx: 900000

    - key: laser
      name: "Depilación láser"
      price_approx: 80000
      unit: sesion                   # por zona/sesión, NO precio total

  valoracion:
    name: "Cita de valoración"
    # La valoración cuesta $80.000 y es REEMBOLSABLE — se descuenta del
    # procedimiento si la persona lo realiza. Es la línea de cierre más fuerte
    # de Sofía: no es un gasto, es un anticipo. SIEMPRE dice costo y reembolso
    # en la misma frase, y SIEMPRE antes de buscar horarios.
    price_approx: 80000
    refundable: true
    refund_note: "Se descuenta del procedimiento si la persona lo realiza"

# -------------------------------------------------------------
# CRM — mapeo a GoHighLevel
#
# GHL es la ÚNICA fuente de la verdad: contactos, calendario y pipeline
# en una sola Location. El backend no guarda estado propio.
#
# -------------------------------------------------------------
# LOCATION DESTINO — cambiada el 2026-08-04
#
# ANTES: una subcuenta demo dental, con ids verificados el 2026-07-20.
# AHORA: "JoinsClee (Funnels & CRM)" — Np6qnux1pM5NRF9JY3lh, America/Bogota.
#
# Los ids viejos NO servían aquí: apuntaban a otra subcuenta y habrían dado
# 404 en calendario y pipeline. Los de abajo se releyeron en vivo de la
# Location nueva el 2026-08-04.
#
# CONSECUENCIA A OJOS ABIERTOS: este es el CRM real de la agencia, no un
# sandbox. Sofía va a crear contactos y oportunidades entre los leads reales
# de JoinsClee. Por eso `outbound.enabled` queda en false (ver ese bloque).
# -------------------------------------------------------------
# El PIT y el location_id viven en .env, NO aquí.
# -------------------------------------------------------------
crm:
  provider: gohighlevel
  api_base: "https://services.leadconnectorhq.com"
  api_version: "2021-07-28"
  # location_id -> .env HIGHLEVEL_LOCATION_ID  (= Np6qnux1pM5NRF9JY3lh)
  # auth        -> .env HIGHLEVEL_PIT (Bearer)

  # Calendario de la Location de JoinsClee, dado por el operador el 2026-08-05.
  # OJO con la deuda consciente: este calendario es de consultorías de la agencia,
  # no una agenda dental. Las "citas de valoración" de Sofía caen ahí mezcladas
  # con las consultorías reales. Sirve para probar; separarlo antes de producción.
  calendar_id: "5cZiNfL2nv2dYORwMxlK"        # "Consultoría Implementación de Funnels y CRM"

  # "1. Funnel Agendamiento (Sistema de Ventas Funnels & CRM)" — releído 2026-08-04.
  # Se eligió entre los 6 pipelines de la Location porque es el único cuyas etapas
  # calzan con el modelo de Sofía, incluida "No Asiste Cita", que alimenta el outbound.
  pipeline_id: "8NridlHOCZAsiQjGhxY0"
  stage_id: "583df04f-1748-40d2-b040-fb0921f95210"   # "🗓️3. Agenda Cita(Online)"

  pipeline_stages:
    # El ORDEN de estas claves es el orden del funnel en el panel
    # (ghl_read_service.py:50-54). Se conserva el del config anterior.
    new_lead: "6676fd94-c279-4d92-9c2d-968287192a28"        # 0. Nuevo Contacto(WA/IG/FB)
    engagement: "93b27fd6-fe90-4454-833a-2e7fea0ac01d"      # 👤1. Nuevo Lead(Cuestionario)
    cita_agendada: "583df04f-1748-40d2-b040-fb0921f95210"   # 🗓️3. Agenda Cita(Online)
    asistio_a_cita: "4414fa50-3c24-45bd-b4c1-c0ca069b242e"  # 🔷5. En Evaluación(Interesado)
    no_asistio: "7641f092-64f6-4eb9-8b6a-39cf932e6bf1"      # 4. No Asiste Cita(Reagendar)
                                                            # ^ alimenta el worker outbound
    tratamiento_en_proceso: "98285545-34bc-473e-aaff-864d6bfbe813"  # ⭕7. A Futuro(Nutrición)
    cliente_ganado: "d6666532-6e0d-4166-bc68-b97e099d6f77"  # ✅6. Venta Ganada(Bienvenida)

    # El eslabón flojo del mapeo es `tratamiento_en_proceso`: este pipeline es de
    # agendamiento de la agencia y no tiene una etapa equivalente. Ninguna ruta
    # automática lo escribe (solo /update-lead-status con stage explícito), así
    # que no rompe nada; queda documentado para no confundir a quien lea el funnel.
    # "🔴2. No Agenda(Seguimiento)" (8473c0d8-b43f-4081-b4df-a3daaeb20ed9) y
    # "❌8. Descartar" (42f9d277-1360-44a8-a20c-230c29ca02fe) quedan sin mapear
    # a propósito: Sofía no tiene un estado que les corresponda.

  custom_fields:
    # Los cinco existen en la Location nueva: creados el 2026-08-05 y verificados
    # contra Np6qnux1pM5NRF9JY3lh con `python scripts/descubrir_ghl.py`.
    #
    # Si alguno faltara, NO degrada en silencio: revienta. `_custom_fields_payload`
    # (ghl_service.py:388) lanza GHLError con "Custom field key(s) not found in
    # the Location" y el endpoint devuelve 502. Como `reason` es un parámetro
    # declarado de las dos tools de Retell, es el payload normal de Sofía: sin
    # estos campos, una llamada real NO agenda nada.
    # (El docstring de esa función habla de un descarte silencioso; se refiere al
    #  shape {key, field_value} de la API, que este repo no usa. Aquí resuelve
    #  ids contra la Location y falla duro si no los encuentra.)
    reason_for_visit: "contact.reason_for_visit"            # TEXT · id X1RsyxvIsaMysbQktxb4
    interes_score: "contact.interes_score"                  # NUMERICAL 1-10 · id OVHuXTLxMgAQPjvnPPmV
    nivel_urgencia: "contact.nivel_urgencia"                # TEXT urgente|normal|baja · id yUsa1pO9kSHssMnGvxOC
    probabilidad_asistir: "contact.probabilidad_asistir"    # NUMERICAL 1-10 · id hkArtjllzQa6DP7bdp6z
    resumen_llamada: "contact.resumen_llamada"              # LARGE_TEXT · id GWx0djCmZkRoej6l0fQO

  # NO USAR — campos que existen pero no nos tocan:
  #   contact.notas_clinicas         -> expediente clínico, lo escribe el doctor.
  #                                     El resumen de Sofía NUNCA va aquí: es output de
  #                                     un modelo sobre una transcripción de teléfono, y
  #                                     alguien acabaría leyéndolo como observación clínica.
  #   contact.fecha_de_ultima_visita -> lo llena la clínica
  #   contact.fecha_vencimiento_cupon -> marketing

  tags:
    # Temperatura del lead, vía POST /contacts/:id/tags
    temperature: ["hot", "warm", "cold"]
    # PENDIENTE: fijar el criterio junto con el análisis post-llamada.
    # Preliminar: urgencia + interés alto -> hot.
    criteria: PENDIENTE_CONFIRMAR

  rules:
    phone_format: E164               # siempre, con + y lada
    appointment_format: iso8601_with_offset   # nunca UTC pelón
    upsert_idempotent_by_phone: true
    free_slots_max_days: 31
    free_slots_filter_keys: ["traceId"]       # no son fechas, truenan el parseo
    # Si GHL falla, el agente NO miente: error honesto + seguimiento humano.
    # Nunca un "ya quedó agendado" falso.
    fail_honestly: true
    failure_message: "Déjame confirmártelo, en un momento te contacta una persona del equipo"

# -------------------------------------------------------------
# OUTBOUND — worker en Modal, cada hora
# -------------------------------------------------------------
outbound:
  # ⚠️ APAGADO A PROPÓSITO el 2026-08-04, por dos razones independientes:
  #
  # 1. La Location es ahora el CRM real de JoinsClee. Con esto en true, el cron
  #    horario leería la etapa "4. No Asiste Cita(Reagendar)" y le MARCARÍA POR
  #    TELÉFONO a leads reales de la agencia, creyendo que son pacientes de una
  #    clínica dental. Sofía se presentaría como recepcionista de "Sonrisa
  #    Perfecta" a alguien que agendó una consultoría de CRM.
  # 2. El outbound además exige la verificación de identidad de Retell. Sin ella
  #    Retell rechaza las salientes y el cron falla en silencio cada hora.
  #
  # Para encenderlo: verificar identidad en Retell, confirmar que los contactos
  # de la etapa son de verdad pacientes, y revisar `exclude_tags` de abajo.
  enabled: false
  schedule_cron: "0 * * * *"
  targets:
    - no_shows        # stage "No Asistió"
    - leads_frescos
  goal: "Recalificar y reagendar"

  # Ventana horaria permitida, en la timezone del negocio.
  # El cron se despierta cada hora; esto es lo que evita que marque a las 3am.
  call_window:
    start_hour: 9        # inclusivo
    end_hour: 19         # exclusivo — 19 significa "hasta las 18:59"
    weekdays: [0, 1, 2, 3, 4, 5]   # lunes=0 ... domingo=6. Sin domingos.

  # Tope por corrida. Con 200 no-shows en el pipeline NO queremos 200 llamadas
  # en la primera vuelta: se drena de a poco, una corrida por hora.
  max_calls_per_run: 10

  # Horas de espera antes de volver a marcarle a la misma persona.
  # Sin esto el cron le marca cada hora al mismo lead.
  cooldown_hours: 24

  # Cuántas veces se intenta antes de rendirse. Insistir más que esto no
  # recupera al paciente, solo molesta.
  max_attempts: 3

  # Contactos con cualquiera de estos tags NUNCA se marcan.
  # `demo-ficticio` protegía los 20 contactos de prueba de la Location VIEJA.
  # En "JoinsClee (Funnels & CRM)" ese tag no existe, así que hoy esta lista no
  # protege a nadie: el filtro real es que `enabled` está en false.
  # Antes de encender el outbound, agregar aquí un tag que marque explícitamente
  # a los contactos que SÍ son pacientes, o invertir la lógica a lista blanca.
  exclude_tags:
    - demo-ficticio
    - no-llamar

  # Dónde vive el estado del seguimiento. En GHL, no en el worker.
  tracking_fields:
    # También existen ya en la Location nueva (creados 2026-08-05).
    # Sin ellos el worker no podría llevar la cuenta: `cooldown_hours` y
    # `max_attempts` dejarían de aplicar y le marcaría al mismo lead cada hora.
    last_attempt: "contact.ultimo_intento_outbound"   # DATE · id 1Xh6LaV1pGw6ErzWP7vo
    attempts: "contact.intentos_outbound"             # NUMERICAL · id j9eBMX7mqfoKlBkg0HiA
